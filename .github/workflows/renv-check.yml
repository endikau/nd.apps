name: renv consistency

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  renv-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Restore renv library from lockfile
        uses: r-lib/actions/setup-renv@v2

      - name: Verify project is in a consistent state
        shell: Rscript {0}
        run: |
          status <- renv::status()
          if (!isTRUE(status$synchronized)) {
            stop(
              "renv::status() reports the project is NOT in a consistent state.\n",
              "Run renv::snapshot() (or renv::restore()) locally and commit renv.lock.",
              call. = FALSE
            )
          }
          cat("No issues found -- the project is in a consistent state.\n")
