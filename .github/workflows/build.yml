name: Build and publish Docker image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  RUNTIME_TAG: 4.6.0-py3.12.12-v3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare npmrc secret
        run: |
          printf '%s' "${{ secrets.NPMRC_FILE }}" > /tmp/.npmrc
        shell: bash

      - name: Build and push image (tracked files only)
        env:
          GITHUB_PAT: ${{ secrets.ND_ACTIONS_READ_TOKEN }}
        run: |
          set -euo pipefail

          secret_args=()
          if [ -n "${GITHUB_PAT:-}" ]; then
            secret_args+=(--secret id=github_pat,env=GITHUB_PAT)
          fi

          git ls-files -z | tar --null -T - -cf - | docker buildx build \
            --secret id=npmrc,src=/tmp/.npmrc \
            "${secret_args[@]}" \
            --build-arg RUNTIME_TAG="${RUNTIME_TAG}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/nd_apps-shiny_serve:latest \
            -t ghcr.io/${{ github.repository_owner }}/nd_apps-shiny_serve:sha-${{ github.sha }} \
            --push \
            -
        shell: bash
