name: Build and publish Docker image

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare npmrc secret
        run: |
          printf '%s' "${{ secrets.NPMRC_FILE }}" > /tmp/.npmrc
        shell: bash

      - name: Build and push image (tracked files only)
        run: |
          set -euo pipefail
          git ls-files -z | tar --null -T - -cf - | docker buildx build \
            --secret id=npmrc,src=/tmp/.npmrc \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/nd_apps-shiny_serve:latest \
            --push \
            -
        shell: bash
